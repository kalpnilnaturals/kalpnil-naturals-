<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6f8f2e">

<title>KalpNil Naturals | Stay Connected</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Arial, sans-serif;

    background:
    radial-gradient(circle at top right,
    #f5e9ad, transparent 35%),
    linear-gradient(145deg,
    #f7f4d9, #dce8b8);
}

.card {
    width: 100%;
    max-width: 440px;
    padding: 28px 22px;
    text-align: center;
    background: #fffef8;
    border: 2px solid #d7dfae;
    border-radius: 26px;
    box-shadow: 0 18px 55px #344b1928;
}

/* ORIGINAL LOGO */

.brand-logo {
    display: block;
    width: 100%;
    max-width: 300px;
    height: auto;
    margin: 0 auto 18px;
    object-fit: contain;
}

.tagline {
    margin-bottom: 25px;
    color: #65734c;
    font-size: 16px;
}

/* SOCIAL BUTTONS */

.button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;

    width: 100%;
    min-height: 58px;
    padding: 15px;

    margin: 16px 0;

    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;

    box-shadow: 0 5px 12px #00000018;
    transition: 0.2s;
}

.button:hover {
    transform: scale(1.02);
}

/* YOUTUBE */

.youtube {
    background: #ff0033;
    border-radius: 8px;
}

/* INSTAGRAM */

.instagram {
    background: linear-gradient(
        110deg,
        #833ab4,
        #e1306c,
        #f77737
    );

    border-radius: 12px;
}

/* ICONS */

.platform-icon {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
}

.note {
    margin-top: 24px;
    font-size: 12px;
    color: #7c8568;
    line-height: 1.6;
}

footer {
    margin-top: 22px;
    font-size: 11px;
    letter-spacing: 1px;
    color: #82915b;
}

</style>
</head>

<body>

<main class="card">

<!-- KALPNIL ORIGINAL LOGO -->

<img
    class="brand-logo"
    src="logo.jpg"
    alt="KalpNil Naturals - Back To Tradition"
>

<p class="tagline">
Natural Goodness. Stay Connected With Us!
</p>


<!-- YOUTUBE SUBSCRIBE -->

<a
class="button youtube"
href="https://www.youtube.com/@kalpnil_naturals?sub_confirmation=1"
target="_blank"
rel="noopener noreferrer"
>

<svg class="platform-icon" viewBox="0 0 24 24">

<path fill="white"
d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2A31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.2 3.6-6.2 3.6Z"/>

</svg>

<span>Subscribe</span>

</a>


<!-- INSTAGRAM FOLLOW -->

<a
class="button instagram"
href="https://www.instagram.com/kalpnil_naturals/"
target="_blank"
rel="noopener noreferrer"
>

<svg class="platform-icon" viewBox="0 0 24 24">

<rect
x="3" y="3"
width="18" height="18"
rx="5"
fill="none"
stroke="white"
stroke-width="2.4"
/>

<circle
cx="12" cy="12"
r="4"
fill="none"
stroke="white"
stroke-width="2.4"
/>

<circle
cx="18" cy="6"
r="1.3"
fill="white"
/>

</svg>

<span>Follow</span>

</a>


<p class="note">
YouTube will ask visitors to confirm Subscribe.<br>
Instagram requires visitors to confirm Follow.
</p>

<footer>
THANK YOU FOR SUPPORTING KALPNIL NATURALS
</footer>

</main>

</body>
</html>
