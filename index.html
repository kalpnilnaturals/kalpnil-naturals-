<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#78952f">
  <title>KalpNil Naturals | Stay Connected</title>
  <style>
    :root { --green:#6f8f2e; --deep:#344b19; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:24px; font-family:Arial,Helvetica,sans-serif; color:var(--deep);
      background:radial-gradient(circle at top right,#f5e9ad 0,transparent 34%),
                 linear-gradient(145deg,#f7f4d9,#dce8b8);
    }
    .card {
      width:min(100%,430px); padding:34px 25px 28px; text-align:center;
      background:rgba(255,255,247,.97); border:2px solid #d7dfae; border-radius:28px;
      box-shadow:0 18px 55px rgba(52,75,25,.16);
    }
    .logo {
      width:94px;height:94px;margin:0 auto 15px;border-radius:50%;
      display:grid;place-items:center;background:linear-gradient(145deg,#91ad42,#496a20);
      color:#fff;font-weight:900;font-size:25px;letter-spacing:1px;
      border:5px solid #e9d77f;
    }
    h1 { margin:8px 0 5px;font-size:27px;letter-spacing:1.2px;color:#526f25; }
    .tagline { margin:0 0 25px;color:#65734c;font-size:15px; }
    .button {
      display:flex;align-items:center;justify-content:center;gap:12px;
      width:100%;padding:17px 18px;margin:14px 0;border-radius:14px;
      color:#fff;text-decoration:none;font-size:16px;font-weight:700;
      box-shadow:0 5px 12px #00000018;
    }
    .youtube { background:#e62117; }
    .instagram { background:linear-gradient(110deg,#833ab4,#e1306c,#f77737); }
    .icon { font-size:22px; }
    .note { margin:22px 0 0;font-size:12px;color:#7c8568;line-height:1.5; }
    footer { margin-top:20px;font-size:11px;letter-spacing:1.2px;color:#82915b; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-label="KalpNil Naturals logo initials">KN</div>
    <h1>KALPNIL NATURALS</h1>
    <p class="tagline">Natural goodness. Stay connected with us!</p>

    <a class="button youtube"
       href="https://www.youtube.com/@kalpnil_naturals?sub_confirmation=1"
       target="_blank" rel="noopener noreferrer">
      <span class="icon">▶</span> SUBSCRIBE NOW
    </a>

    <a class="button instagram"
       href="https://www.instagram.com/kalpnil_naturals/"
       target="_blank" rel="noopener noreferrer">
      <span class="icon">◎</span> FOLLOW NOW
    </a>

    <p class="note">YouTube will ask the visitor to confirm Subscribe.<br>
      Instagram requires the visitor to tap Follow in the app or website.</p>
    <footer>THANK YOU FOR SUPPORTING KALPNIL NATURALS</footer>
  </main>
</body>
</html>
